[package]
name = "corndelight-horizon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Native Sunrise port of Corn Delight"

# The base mod (ported_farmersdelight) is NOT listed here: the launcher adds it as a path dependency from
# sunrise-mod.toml [dependencies]. Local builds and tests use tools/cargo_dev.py, which adds it in a scratch copy.
[dependencies]
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }

[dev-dependencies]
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api", features = ["testing"] }
